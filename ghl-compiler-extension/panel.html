<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHL Compiler</title>
<style>
:root {
  --bg: #0c1120; --surface: #131d30; --surface2: #1b2840; --surface3: #232f48;
  --border: #243048; --fg: #dde4f0; --fg-muted: #7a8ba8; --fg-dim: #3a4e68;
  --accent: #e91e8c; --accent-dim: rgba(233,30,140,0.12);
  --green: #4ade80; --green-dim: rgba(74,222,128,0.1);
  --yellow: #fbbf24; --red: #f87171; --code-bg: #080e1a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, 'Inter', system-ui, sans-serif;
  font-size: 13px; background: var(--bg); color: var(--fg);
  display: flex; flex-direction: column;
}

/* Header */
.header {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 0 12px; height: 44px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.logo { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.logo-pill { background: var(--accent); color: #fff; font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 5px; border-radius: 3px; }
.header-gap { flex: 1; }
.tpl-select {
  background: var(--surface2); border: 1px solid var(--border); color: var(--fg-muted);
  font-size: 11px; font-family: inherit; padding: 4px 6px; border-radius: 4px; cursor: pointer;
}
.compile-btn {
  background: var(--accent); color: #fff; border: none; font-family: inherit;
  font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 5px;
  cursor: pointer; display: flex; align-items: center; gap: 5px; transition: opacity .15s;
}
.compile-btn:hover { opacity: .85; }

/* Inject bar */
.inject-bar {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.inject-btn {
  flex: 1; background: var(--green-dim); color: var(--green);
  border: 1px solid var(--green); font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 7px 12px; border-radius: 5px; cursor: pointer; transition: background .15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.inject-btn:hover { background: rgba(74,222,128,0.2); }
.inject-btn:disabled { opacity: .4; cursor: not-allowed; }
.inject-btn.success { background: var(--green); color: #000; border-color: var(--green); }
.inject-btn.error { background: rgba(248,113,113,0.1); color: var(--red); border-color: var(--red); }
.copy-json-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--fg-muted);
  font-family: inherit; font-size: 11px; padding: 6px 10px; border-radius: 5px; cursor: pointer;
  white-space: nowrap; transition: color .15s;
}
.copy-json-btn:hover { color: var(--fg); }
.copy-json-btn.success { color: var(--green); border-color: var(--green); }
.sniff-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--fg-muted);
  font-family: inherit; font-size: 11px; padding: 6px 10px; border-radius: 5px; cursor: pointer;
  white-space: nowrap; transition: color .15s;
}
.sniff-btn:hover { color: var(--fg); }
.sniff-output {
  flex-shrink: 0; padding: 8px 12px; background: var(--code-bg);
  border-bottom: 1px solid var(--border); font-family: monospace; font-size: 10px;
  color: var(--yellow); max-height: 100px; overflow: auto; white-space: pre-wrap;
}

/* Panes */
.workspace { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.pane { display: flex; flex-direction: column; min-height: 0; }
.pane-a { flex: 0 0 45%; border-bottom: 2px solid var(--accent); }
.pane-b { flex: 1; }

.pane-header {
  display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 30px;
  background: var(--surface2); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.pane-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-muted); }
.pane-badge { font-size: 10px; font-family: monospace; padding: 1px 5px; border-radius: 3px; background: var(--surface3); color: var(--fg-muted); }
.pane-badge.ok { background: var(--green-dim); color: var(--green); }

.editor {
  flex: 1; width: 100%; resize: none; border: none; outline: none;
  background: var(--bg); color: var(--fg);
  font-family: 'Courier New', monospace; font-size: 11.5px; line-height: 1.6;
  padding: 12px; overflow: auto;
}
.editor::placeholder { color: var(--fg-dim); }

.output {
  flex: 1; overflow: auto; background: var(--code-bg);
  font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.6;
  padding: 12px; color: #7ec8a4; white-space: pre; word-break: break-all;
  white-space: pre-wrap;
}
.output.empty { color: var(--fg-dim); font-family: -apple-system, system-ui, sans-serif; font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; white-space: normal; }

/* Status */
.statusbar {
  flex-shrink: 0; display: flex; align-items: center; gap: 12px;
  padding: 0 12px; height: 24px;
  background: var(--surface); border-top: 1px solid var(--border);
  font-size: 10px; color: var(--fg-muted); font-family: monospace;
}
.stat { display: flex; gap: 3px; }
.stat span { color: var(--fg); font-weight: 600; }
.err-msg { color: var(--red); margin-left: auto; font-size: 10px; }
.autowrap { color: var(--yellow); }
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span class="logo-pill">GHL</span> Compiler</div>
  <div class="header-gap"></div>
  <select class="tpl-select" id="tplSelect">
    <option value="">Templates…</option>
    <option value="plain">Plain HTML</option>
    <option value="hero">Hero Section</option>
    <option value="cta">CTA Section</option>
    <option value="bullets">Benefits</option>
    <option value="video">Video Section</option>
    <option value="full">Full Page (3 sections)</option>
  </select>
  <button class="compile-btn" id="compileBtn">
    ▶ Compile
  </button>
</div>

<div class="inject-bar">
  <button class="inject-btn" id="injectBtn" disabled>
    ⚡ Inject into GHL Builder
  </button>
  <button class="copy-json-btn" id="copyBtn" disabled>Copy JSON</button>
  <button class="sniff-btn" id="debugBtn" title="Scan the GHL builder tab to find injectable hooks">🔍 Debug GHL</button>
</div>
<div class="sniff-output" id="debugOutput" style="display:none"></div>

<div class="workspace">
  <div class="pane pane-a">
    <div class="pane-header">
      <span class="pane-title">HTML Input</span>
      <span class="pane-badge" id="inputBadge">—</span>
    </div>
    <textarea class="editor" id="editor" spellcheck="false"
      placeholder="Paste any HTML here.

Plain tags auto-detected:
  &lt;h1&gt;/&lt;h2&gt; → c-heading
  &lt;h3&gt;-&lt;h6&gt; → c-sub-heading
  &lt;p&gt; → c-paragraph
  &lt;button&gt; / &lt;a.btn&gt; → c-button
  &lt;img&gt; → c-image
  &lt;ul&gt;/&lt;ol&gt; → c-bullet-list
  &lt;hr&gt; → c-divider
  &lt;section&gt; → section wrapper

Inline styles extracted automatically.

Ctrl+Enter to compile."></textarea>
  </div>

  <div class="pane pane-b">
    <div class="pane-header">
      <span class="pane-title">GHL JSON</span>
      <span class="pane-badge" id="outputBadge">—</span>
    </div>
    <div class="output empty" id="output">Compiled GHL JSON appears here</div>
  </div>
</div>

<div class="statusbar">
  <div class="stat">sections <span id="sSections">0</span></div>
  <span style="color:var(--border)">·</span>
  <div class="stat">elements <span id="sElements">0</span></div>
  <span style="color:var(--border)">·</span>
  <div class="stat">rows <span id="sRows">0</span></div>
  <span class="autowrap" id="autowrapNote" style="display:none">auto-wrapped</span>
  <div class="err-msg" id="errMsg"></div>
</div>

<script src="panel.js"></script>
</body>
</html>
