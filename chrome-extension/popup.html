<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Challenge Funnel Helper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #111827;
      background: #ffffff;
    }

    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 16px 20px 14px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    .header p {
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      margin-top: 2px;
    }

    .section {
      padding: 16px 20px;
      border-bottom: 1px solid #f1f5f9;
    }
    .section:last-child { border-bottom: none; }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .page-list { display: flex; flex-direction: column; gap: 6px; }

    .page-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #f8fafc;
      border-radius: 8px;
      gap: 8px;
    }
    .page-label { font-size: 13px; font-weight: 500; color: #374151; flex: 1; }
    .page-status { font-size: 11px; color: #9ca3af; }

    .inject-btn {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      background: #f97316;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .inject-btn:hover { background: #ea580c; }
    .inject-btn:disabled { background: #d1d5db; cursor: not-allowed; }

    .file-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .file-input-label {
      font-size: 12px;
      color: #374151;
      margin-bottom: 2px;
    }
    .file-input {
      width: 100%;
      font-size: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px 10px;
      background: #f8fafc;
      cursor: pointer;
    }

    .load-btn {
      width: 100%;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }
    .load-btn:hover { background: #1e293b; }

    .status-bar {
      font-size: 11px;
      color: #6b7280;
      text-align: center;
      padding: 10px 20px;
      background: #f8fafc;
    }
    .status-bar.success { color: #16a34a; }
    .status-bar.error   { color: #dc2626; }

    .no-pages {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Challenge Funnel Helper</h1>
    <p>Inject page JSON into GoHighLevel builder</p>
  </div>

  <!-- Loaded pages -->
  <div class="section">
    <div class="section-title">Loaded Pages</div>
    <div id="page-list" class="page-list">
      <p class="no-pages">No pages loaded yet. Load JSON files below.</p>
    </div>
  </div>

  <!-- Load JSON files -->
  <div class="section">
    <div class="section-title">Load Page Files</div>
    <div class="file-row">
      <label class="file-input-label">Select one or more exported JSON files:</label>
      <input type="file" id="file-input" class="file-input" accept=".json" multiple />
      <button class="load-btn" id="load-btn">Load Files</button>
    </div>
  </div>

  <div id="status-bar" class="status-bar">Open the GHL page builder, then click Inject.</div>

  <script src="popup.js"></script>
</body>
</html>
